
name: Agent platform quality

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline repository controls
        timeout-minutes: 5
        run: python3 scripts/check_repository_quality.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src pipelines scripts tests
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Ten-control quality gate
        run: python scripts/quality_gate.py
      - name: Fail-closed security gate
        run: python scripts/security_gate.py
